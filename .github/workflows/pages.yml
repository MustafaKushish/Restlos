# Stellt Restlos auf GitHub Pages bereit: https://<name>.github.io/Restlos/
# Von dort lässt sich die App auf Handy und Tablet installieren („Zum Home-Bildschirm“).
name: Web-App (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Web-App zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          touch _site/.nojekyll
      - name: Gemini-Schlüssel der App einsetzen (falls als Secret hinterlegt)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
            const fs = require("fs"), f = "_site/js/config.js", k = process.env.GEMINI_API_KEY || "";
            if (!k) { console.log("Kein GEMINI_API_KEY-Secret – Nutzer tragen selbst einen Schlüssel ein."); process.exit(0); }
            if (!/^[A-Za-z0-9_-]+$/.test(k)) { console.error("GEMINI_API_KEY sieht ungültig aus"); process.exit(1); }
            const s = fs.readFileSync(f, "utf8"), t = s.replace("appKey: \x27\x27", "appKey: " + JSON.stringify(k));
            if (s === t) { console.error("appKey nicht gefunden"); process.exit(1); }
            fs.writeFileSync(f, t); console.log("App-Schlüssel eingesetzt.");
          '
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
