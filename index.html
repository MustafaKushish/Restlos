<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Restlos</title>
  <meta name="description" content="Restlos – Vorrat ohne Tipparbeit: Kassenbon scannen, vor Verfall gewarnt werden, Reste verkochen oder im Hausflur verschenken.">
  <meta name="theme-color" content="#1f7a4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Restlos">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><img src="icons/icon.svg" alt="" width="30" height="30"><span>Restlos</span></div>
      <button class="lang-top" data-action="language" aria-label="Sprache" data-i18n-label="Sprache"><span aria-hidden="true">🌐</span><b id="lang-code">DE</b></button>
      <button class="icon-btn" data-action="add" aria-label="Lebensmittel hinzufügen" data-i18n-label="Lebensmittel hinzufügen">＋</button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="tabs" id="tabs" aria-label="Bereiche" data-i18n-label="Bereiche">
    <a href="#/vorrat" data-tab="vorrat"><svg viewBox="0 0 24 24"><path d="M5 3h14a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM4 10h16M8 6v2M8 13v4"/></svg><span data-i18n>Vorrat</span></a>
    <a href="#/rezepte" data-tab="rezepte"><svg viewBox="0 0 24 24"><path d="M6 14a4 4 0 0 1-1-7.9A5 5 0 0 1 14.6 5 4 4 0 1 1 18 14M6 14v6h12v-6M6 17h12"/></svg><span data-i18n>Rezepte</span></a>
    <a href="#/einkauf" data-tab="einkauf"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h11L21 7H6.2M9 20a1 1 0 1 0 0-.01M18 20a1 1 0 1 0 0-.01"/></svg><span data-i18n>Einkauf</span></a>
    <a href="#/teilen" data-tab="teilen"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span data-i18n>Teilen</span></a>
    <a href="#/bilanz" data-tab="bilanz"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n>Bilanz</span></a>
  </nav>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="photo" accept="image/*" multiple hidden>
  <input type="file" id="backup" accept="application/json,.json" hidden>
  <script>
    // Notbremse: Startet die App nicht (z. B. ein halb geladenes Update), einmal frisch laden – sonst ein Knopf statt weißer Seite.
    (function () {
      function rescue() {
        if (window.restlosReady) return;
        var tried = null;
        try { tried = sessionStorage.getItem('restlos:retry'); sessionStorage.setItem('restlos:retry', '1'); } catch (e) { tried = '1'; }
        if (!tried && navigator.onLine !== false) {
          var clear = window.caches ? caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) { return k.indexOf('restlos-v') === 0; }).map(function (k) { return caches.delete(k); }));
          }) : Promise.resolve();
          clear.then(function () { location.reload(); }, function () { location.reload(); });
          return;
        }
        var view = document.getElementById('view');
        if (view) view.innerHTML = '<section class="empty"><div class="big">🔄</div><p>Restlos konnte nicht starten · Restlos could not start</p><button class="btn primary" onclick="location.reload()">↻</button></section>';
      }
      window.addEventListener('error', function (e) { if (!window.restlosReady && /\/js\//.test(e.filename || '')) setTimeout(rescue, 300); });
      setTimeout(rescue, 10000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
